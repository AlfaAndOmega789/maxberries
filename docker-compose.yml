
services:
  postgres:
    image: postgres:16
    container_name: postgres_local
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  catalog_service:
      build:
        context: ./catalog_service
        dockerfile: Dockerfile
      container_name: catalog_service_new
      restart: always
      env_file:
        - .env
      depends_on:
        - postgres
      ports:
        - "8090:8090"

volumes:
  postgres_data: